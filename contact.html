<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | DevOps Collective</title>
    <style>
        body {
            background: #030b25;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        header {
            padding: 20px;
            background: #091a3b;
            text-align: center;
        }
        a {  color: #a78bfa; margin: 10px; }
        main {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 40px 15px;
        }
        section {
            background: #091a3b;
            border: 1px solid #183b70;
            border-radius: 10px;
            padding: 25px;
            width: 300px;
        }
        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            background: #030b25;
            color: white;
            border: 1px solid #183b70;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #813cff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header>
        <h3>∞ DevOps Collective</h3>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="technologies.html">Technologies</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </header>

    <main>
        <section>
            <h1>Contact Information</h1>
            <p>✉ Email: devopscollective@gmail.com</p>
            <p>☎ Phone: +91 98765 43210</p>
            <p>📍 Location: Online / Remote</p>
            <h3>Follow Us</h3>
            <a href="https://github.com/">GitHub</a>
            <a href="https://www.linkedin.com/">LinkedIn</a>
        </section>

        <section>
            <h1>Let's Connect</h1>
            <form id="contactForm">
                <label>Name</label>
                <input type="text" placeholder="Enter your name" required>

                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Subject</label>
                <select required>
                    <option value="">Select a subject</option>
                    <option>General Inquiry</option>
                    <option>Project Collaboration</option>
                    <option>Technical Support</option>
                </select>

                <label>Message</label>
                <textarea placeholder="Type your message..." required></textarea>

                <button type="submit">➤ Send Message</button>
                <p id="status"></p>
            </form>
        </section>
    </main>

    <script>
        document.getElementById("contactForm").onsubmit = function(e) {
            e.preventDefault();
            document.getElementById("status").textContent =
                "Form submitted! Connect a backend to send messages.";
        };
    </script>
</body>
</html>
